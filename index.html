<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WC Command Center</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="512x512" href="wc-favicon.png">
<link rel="apple-touch-icon" href="wc-favicon.png">
<style>
:root{
  color-scheme:dark;
  --bg:#0d0f11;--panel:#111315;--panel2:#16181a;--line:#383c40;
  --text:#f7f7f5;--muted:#9ca2a7;--orange:#ff6508;--orange2:#bd4500;
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{
  color:var(--text);font-family:Arial,Helvetica,sans-serif;
  background:
    linear-gradient(115deg,transparent 0 55%,rgba(255,101,8,.04) 80%,transparent 100%),
    #0d0f11;
}
.shell{
  width:100%;max-width:1600px;margin:auto;
  padding:
    max(10px,var(--safe-top))
    max(16px,var(--safe-right))
    max(10px,var(--safe-bottom))
    max(16px,var(--safe-left));
}
.brandbar{
  min-height:48px;border-bottom:1px solid #2d3135;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:0 6px;margin-bottom:10px;
}
.brand{font-weight:950;letter-spacing:.09em;font-size:17px;white-space:nowrap}
.brand span{color:var(--orange)}
.status{font-size:10px;letter-spacing:.14em;font-weight:800;color:var(--muted);text-transform:uppercase}
.status b{color:var(--orange)}
.dashboard{display:grid;grid-template-columns:minmax(260px,.8fr) minmax(430px,1.45fr);gap:10px}
.card{
  position:relative;background:linear-gradient(135deg,#101214,#151719);
  border:1px solid var(--line);overflow:hidden;
}
.card:after{
  content:"";position:absolute;width:130px;height:130px;right:-70px;bottom:-70px;
  border:1px solid rgba(255,101,8,.16);transform:rotate(45deg);pointer-events:none;
}
.clock{
  min-height:310px;display:flex;align-items:center;justify-content:center;
  border-top:3px solid var(--orange);
  /* Deliberately centered away from either landscape edge/camera cutout. */
  padding:22px max(36px,calc(var(--safe-left) + 10px)) 22px max(36px,calc(var(--safe-right) + 10px));
}
.clock-inner{
  width:100%;max-width:760px;text-align:center;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.eyebrow{
  width:100%;display:flex;align-items:center;justify-content:center;gap:12px;
  color:var(--orange);font-size:11px;letter-spacing:.2em;font-weight:900;text-transform:uppercase;
  margin-bottom:17px;
}
.eyebrow:before,.eyebrow:after{content:"";height:2px;background:var(--orange);width:min(70px,12vw)}
.time{
  font-size:clamp(58px,9vw,128px);font-weight:950;letter-spacing:-.055em;
  line-height:.84;font-variant-numeric:tabular-nums;white-space:nowrap;
}
.date-rule{width:min(520px,88%);height:1px;background:#4b2a19;margin:22px auto 15px;position:relative}
.date-rule:after{
  content:"";position:absolute;left:50%;top:-5px;width:10px;height:10px;
  border-right:2px solid var(--orange);border-bottom:2px solid var(--orange);
  transform:translateX(-50%) rotate(45deg);background:var(--panel);
}
.date{
  font-size:clamp(15px,1.7vw,22px);font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;color:#ededeb;text-align:center;
}
.header{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:13px 15px;background:#17191b;border-bottom:1px solid #3a3e42;
  border-left:4px solid var(--orange);
}
.header h2{font-size:15px;margin:0;text-transform:uppercase;letter-spacing:.13em;font-weight:950}
.count{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.todo-body{padding:13px}
form{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}
input[type=text]{
  width:100%;min-width:0;border:1px solid #454a4f;background:#0b0d0f;color:var(--text);
  border-radius:0;padding:11px 13px;font:inherit;font-size:16px;outline:none;
}
input[type=text]:focus{border-color:var(--orange);box-shadow:inset 3px 0 0 var(--orange)}
button{
  border:1px solid var(--orange);border-radius:0;padding:9px 15px;font:inherit;
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:900;
  cursor:pointer;background:var(--orange);color:#090a0b;min-height:42px;
}
.ghost{background:transparent;color:#eee;border-color:#555a5f}
#list{list-style:none;margin:0;padding:0;display:grid;gap:7px;max-height:46vh;overflow:auto}
.todo{
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  padding:9px 10px;background:var(--panel2);border:1px solid #33373b;border-left:3px solid #555b60;
}
.todo input{width:19px;height:19px;accent-color:var(--orange)}
.todo.done{border-left-color:var(--orange2)}
.todo.done .label{text-decoration:line-through;color:#74797e}
.label{font-size:14px;min-width:0;overflow-wrap:anywhere}
.remove{background:transparent;color:#858b90;border:0;padding:4px 8px;min-height:32px;font-size:18px}
.empty{
  color:#777d82;text-align:center;padding:22px 8px;border:1px dashed #3b4044;
  text-transform:uppercase;letter-spacing:.08em;font-size:11px;
}
.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;color:#7f858a;font-size:10px}

/* Portrait / narrow browser fallback */
@media(max-width:760px) and (orientation:portrait){
  .dashboard{grid-template-columns:1fr}
  .clock{min-height:220px;order:-1}
  .brandbar{min-height:44px}
}

/* iPhone landscape: reserve both hardware-safe edges, center clock in the usable region. */
@media(orientation:landscape) and (max-height:500px){
  .shell{
    padding-top:max(5px,var(--safe-top));
    padding-bottom:max(5px,var(--safe-bottom));
    padding-left:max(14px,var(--safe-left));
    padding-right:max(14px,var(--safe-right));
  }
  .brandbar{min-height:34px;margin-bottom:7px}
  .brand{font-size:14px}.status{font-size:9px}
  .dashboard{grid-template-columns:minmax(235px,.78fr) minmax(390px,1.45fr);gap:8px}
  .clock{
    min-height:calc(100vh - 53px - var(--safe-top) - var(--safe-bottom));
    padding-left:max(42px,calc(var(--safe-left) + 18px));
    padding-right:max(42px,calc(var(--safe-right) + 18px));
  }
  .clock-inner{max-width:650px}
  .eyebrow{margin-bottom:12px}
  .time{font-size:clamp(58px,10.5vw,105px)}
  .date-rule{margin:17px auto 11px}
  .date{font-size:clamp(13px,1.8vw,18px)}
  .header{padding:9px 12px}.todo-body{padding:9px}
  form{margin-bottom:7px}#list{max-height:calc(100vh - 145px)}
  .todo{padding:7px 9px}.footer{margin-top:7px}
}
</style>
</head>
<body>
<main class="shell">
  <header class="brandbar">
    <div class="brand">WILSON <span>&amp;</span> CREEK</div>
    <div class="status"><b>●</b> Command Center / Local</div>
  </header>

  <div class="dashboard">
    <section class="card" aria-label="To-do list">
      <div class="header">
        <h2>To Do</h2>
        <span id="count" class="count"></span>
      </div>
      <div class="todo-body">
        <form id="form">
          <input type="text" id="newTodo" maxlength="180" autocomplete="off" placeholder="Add a task…" aria-label="New to-do item">
          <button type="submit">Add</button>
        </form>
        <ul id="list"></ul>
        <div class="footer">
          <span>Local browser storage</span>
          <button id="clearDone" type="button" class="ghost">Clear completed</button>
        </div>
      </div>
    </section>

    <section class="card clock" aria-label="Current time and date">
      <div class="clock-inner">
        <div class="eyebrow">Command Center</div>
        <div id="time" class="time">--:--</div>
        <div class="date-rule"></div>
        <div id="date" class="date">Loading date…</div>
      </div>
    </section>
  </div>
</main>

<script>
const KEY='wcCommandCenterTodos.v1';
const $=s=>document.querySelector(s);
let todos=[];
try{
  todos=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('commandCenterTodos.v1')||'[]');
  if(!Array.isArray(todos)) todos=[];
}catch{todos=[]}

function save(){localStorage.setItem(KEY,JSON.stringify(todos))}
function updateClock(){
  const d=new Date();
  document.querySelector('#time').textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  document.querySelector('#date').textContent=d.toLocaleDateString([], {
    weekday:'long',month:'long',day:'numeric',year:'numeric'
  });
}
function render(){
  const list=$('#list'); list.innerHTML='';
  const open=todos.filter(t=>!t.done).length;
  $('#count').textContent=`${open} open · ${todos.length} total`;
  if(!todos.length){
    list.innerHTML='<li class="empty">Nothing on the list.</li>';
    return;
  }
  todos.forEach(t=>{
    const li=document.createElement('li'); li.className='todo'+(t.done?' done':'');
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=!!t.done;
    cb.setAttribute('aria-label','Mark complete');
    cb.addEventListener('change',()=>{t.done=cb.checked;save();render()});
    const label=document.createElement('span'); label.className='label'; label.textContent=t.text;
    const rm=document.createElement('button'); rm.type='button'; rm.className='remove'; rm.textContent='×';
    rm.setAttribute('aria-label','Delete item');
    rm.addEventListener('click',()=>{todos=todos.filter(x=>x.id!==t.id);save();render()});
    li.append(cb,label,rm); list.append(li);
  });
}
$('#form').addEventListener('submit',e=>{
  e.preventDefault();
  const input=$('#newTodo'), text=input.value.trim();
  if(!text)return;
  todos.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),text,done:false});
  input.value='';save();render();input.focus();
});
$('#clearDone').addEventListener('click',()=>{todos=todos.filter(t=>!t.done);save();render()});
updateClock(); setInterval(updateClock,1000); render();
</script>
</body>
</html>
